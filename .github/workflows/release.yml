name: Release signed images
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [guardrail-api, inference-service, control-plane, sync-agent, audit-worker, telemetry-exporter]
    steps:
      - uses: actions/checkout@v4
      - name: Validate semantic tag
        run: '[[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - id: name
        env: {REPO: '${{ github.repository }}', SERVICE: '${{ matrix.service }}'}
        run: echo "image=ghcr.io/${REPO,,}-${SERVICE}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.ref_name }}
      - uses: sigstore/cosign-installer@v3
      - env:
          IMAGE: ${{ steps.name.outputs.image }}@${{ steps.image.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
