name: Generate dependency locks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  locks:
    if: github.head_ref == 'chore/02-reproducible-builds'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: corepack enable && corepack prepare pnpm@10.12.4 --activate
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - run: python -m venv /tmp/lock-env
      - run: /tmp/lock-env/bin/pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: /tmp/lock-env/bin/pip install -r apps/inference-service/requirements.txt
      - run: /tmp/lock-env/bin/pip freeze > apps/inference-service/requirements.lock.txt
      - name: Emit generated locks
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          for name in ['pnpm-lock.yaml','apps/inference-service/requirements.lock.txt']:
              data = base64.b64encode(Path(name).read_bytes()).decode()
              for i in range(0, len(data), 4000):
                  print('LOCK_CHUNK', name, i, data[i:i+4000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-locks
          path: |
            pnpm-lock.yaml
            apps/inference-service/requirements.lock.txt
