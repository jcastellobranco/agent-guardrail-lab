name: Format preview
on:
  pull_request:
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: corepack enable && corepack prepare pnpm@10.12.4 --activate
      - run: pnpm install --no-frozen-lockfile
      - run: pip install ruff==0.11.13
      - run: pnpm format
      - run: ruff format apps/inference-service scripts/probe-gate.py
      - name: Emit formatted source for review
        run: |
          python - <<'PY'
          import base64, subprocess
          from pathlib import Path
          for name in subprocess.check_output(['git','diff','--name-only','-z']).decode().split('\0'):
              if name.endswith(('.ts','.py')):
                  print('FORMAT_FILE '+name+' '+base64.b64encode(Path(name).read_bytes()).decode())
          PY
      - run: ruff check apps/inference-service scripts/probe-gate.py
