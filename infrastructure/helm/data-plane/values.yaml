tenantId: tenant-a
deploymentId: lab-silo
controlPlaneUrl: https://control.example.com
latencyBudgetMs: 50
maxPolicyAgeMs: 300000
syncIntervalMs: 30000
imageRepository: ghcr.io/jcastellobranco/agent-guardrail-lab
imageTag: v0.6.0
existingSecret: guardrail-data-plane
cacheStorage: 1Gi
storageClassName: ""
# Secret keys: jwt.pem, bundle.pem, sync-token, local-audit-database-url
# Optional probe service reads artifacts from a PVC (pre-populated, or filled by the sync agent
# with syncArtifacts); the model cache must be prepared externally.
inference:
  enabled: false
  modelRevision: "2290a62"
  modelLayer: "3"
  maxTokens: "256"
  probeVersion: "1.0.0"
  artifactClaim: guardrail-probes
  # When true, the sync agent downloads signed probe artifacts listed in each bundle into the
  # artifact PVC (read-write for sync-agent, read-only for inference) before accepting it.
  syncArtifacts: false
  modelCacheClaim: guardrail-model-cache
  resources:
    requests: {cpu: "1", memory: 1Gi}
    limits: {cpu: "2", memory: 2Gi}
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: "1", memory: 512Mi}
